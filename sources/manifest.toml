# What extraction reads. One table per source.
#   reader   pdf | scp
#   author   set for single-author collections; anthologies take it per story from the outline
#   dev      part of the development subset (`extract` with no scope reads only these)
#   dev_only for a glob source, the file stems that count as dev
#   stories  optional override: [{title = "...", page = N}, ...] replaces outline and page cues

[source.scp]
path = "sources/scp/scp-*.md"
reader = "scp"
genre = "horror"
license = "CC BY-SA 3.0"
dev = true
dev_only = ["scp-2151", "scp-610", "scp-3929", "scp-5740", "scp-2845", "scp-2000", "scp-3625", "scp-001-djk1-the-children", "scp-4390", "scp-8947"]

