<svg width="100%" viewBox="0 0 680 830" role="img" xmlns="http://www.w3.org/2000/svg"><title>Fog Belt seed pipeline</title><desc>Two lanes. Passages are harvested from the source texts and scored on Biber's six dimensions; themes are drafted by a session against a brief and validated on ingest. Both banks feed one draw, which renders a packet the seeding skill generates from. There is no cull.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.tn{font-size:11.5px;font-weight:400;fill:#5F5E5A;font-style:italic}
.lane{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#73726c}
.arr{stroke:#73726c;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
.plain{stroke:#73726c;stroke-width:1.5;fill:none}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}
.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73726c"/></marker></defs>

<text class="lane" x="30" y="34">PASSAGES — HOW IT READS</text>
<text class="lane" x="360" y="34">THEMES — WHAT GETS MADE</text>

<g class="gray"><rect x="30" y="46" width="290" height="52" rx="4"/>
  <text class="th" x="46" y="68">sources/texts/</text>
  <text class="ts" x="46" y="86">109 SCP articles · 29 anthology PDFs</text></g>
<g class="gray"><rect x="360" y="46" width="290" height="52" rx="4"/>
  <text class="th" x="376" y="68">sources/summaries/</text>
  <text class="ts" x="376" y="86">reference registers, read by hand</text></g>

<path class="arr" d="M175 98 V136"/>
<path class="arr" d="M505 98 V136"/>

<g class="purple"><rect x="30" y="136" width="290" height="52" rx="4"/>
  <text class="th" x="46" y="158">pipeline harvest</text>
  <text class="ts" x="46" y="176">overlapping windows, best 12 per doc</text></g>
<g class="purple"><rect x="360" y="136" width="290" height="52" rx="4"/>
  <text class="th" x="376" y="158">pipeline themes --brief</text>
  <text class="ts" x="376" y="176">the grain, plus 8 lines from grain.md</text></g>

<path class="arr" d="M175 188 V226"/>
<path class="arr" d="M505 188 V226"/>

<g class="purple"><rect x="30" y="226" width="290" height="52" rx="4"/>
  <text class="th" x="46" y="248">pipeline facets</text>
  <text class="ts" x="46" y="266">Biber D1–D6, standardised over the pool</text></g>
<g class="coral"><rect x="360" y="226" width="290" height="52" rx="4"/>
  <text class="th" x="376" y="248">a session drafts</text>
  <text class="ts" x="376" y="266">one sentence: a mechanism and a turn</text></g>

<path class="arr" d="M175 278 V316"/>
<path class="arr" d="M505 278 V316"/>

<g class="teal"><rect x="30" y="316" width="290" height="52" rx="4"/>
  <text class="th" x="46" y="338">examples.jsonl</text>
  <text class="ts" x="46" y="356">1,016 passages, verbatim, six scores each</text></g>
<g class="purple"><rect x="360" y="316" width="290" height="52" rx="4"/>
  <text class="th" x="376" y="338">pipeline themes --ingest</text>
  <text class="ts" x="376" y="356">rejects: proper nouns, deixis, wrong length</text></g>

<path class="arr" d="M505 368 V406"/>
<g class="teal"><rect x="360" y="406" width="290" height="52" rx="4"/>
  <text class="th" x="376" y="428">themes.jsonl</text>
  <text class="ts" x="376" y="446">38 themes, portable off their source</text></g>

<path class="plain" d="M175 368 V496 H340"/>
<path class="plain" d="M505 458 V496 H340"/>
<path class="arr" d="M340 490 V520"/>

<g class="purple"><rect x="170" y="520" width="340" height="52" rx="4"/>
  <text class="th" x="186" y="542">pipeline draw</text>
  <text class="ts" x="186" y="560">one example per facet cell before any cell repeats</text></g>

<path class="arr" d="M340 572 V610"/>

<g class="teal"><rect x="170" y="610" width="340" height="52" rx="4"/>
  <text class="th" x="186" y="632">the packet</text>
  <text class="ts" x="186" y="650"># REGISTER, then # SEED nearest the ask</text></g>

<path class="arr" d="M340 662 V700"/>

<g class="coral"><rect x="170" y="700" width="340" height="52" rx="4"/>
  <text class="th" x="186" y="722">seed-premises</text>
  <text class="ts" x="186" y="740">tail sampling, modal excluded, batch blind</text></g>

<text class="tn" x="30" y="790">No cull. Keep, pass and maybe, the decision trail and both reviewers were removed on 2026-09-03,</text>
<text class="tn" x="30" y="808">to be re-added later. Both banks are pools as they stand, and draw samples the whole of them.</text>
</svg>
