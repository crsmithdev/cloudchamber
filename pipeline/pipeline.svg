<svg width="100%" viewBox="0 0 680 1090" role="img" xmlns="http://www.w3.org/2000/svg"><title>Fog Belt seed pipeline</title><desc>Flowchart from source corpus through local extraction, manual culling, dice draw, tail-sampled generation, partial execution, judging, and logging.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}
.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="gray"><rect x="60" y="30" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="50" text-anchor="middle" dominant-baseline="central">Refs corpus</text><text class="ts" x="180" y="68" text-anchor="middle" dominant-baseline="central">PDFs, never opened here</text></g>
<g class="gray"><rect x="380" y="30" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="50" text-anchor="middle" dominant-baseline="central">SCP scrape</text><text class="ts" x="500" y="68" text-anchor="middle" dominant-baseline="central">Markdown, already working</text></g>

<path d="M180 86 L180 106 L340 106 L340 126" class="arr" marker-end="url(#arrow)"/>
<path d="M500 86 L500 106 L340 106" class="arr"/>

<g class="gray"><rect x="200" y="126" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="146" text-anchor="middle" dominant-baseline="central">Local extraction</text><text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">Slices by structural signal</text></g>
<line x1="340" y1="182" x2="340" y2="222" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="200" y="222" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="242" text-anchor="middle" dominant-baseline="central">Candidates</text><text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">Noisy, tagged, generous</text></g>
<line x1="340" y1="278" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>

<g class="coral"><rect x="200" y="318" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">Chris culls</text><text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central">Manual, permanently</text></g>
<line x1="340" y1="374" x2="340" y2="414" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="60" y="414" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="434" text-anchor="middle" dominant-baseline="central">examples.md</text><text class="ts" x="200" y="452" text-anchor="middle" dominant-baseline="central">Verbatim, six to ten</text></g>
<g class="purple"><rect x="400" y="414" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="434" text-anchor="middle" dominant-baseline="central">Dice draw</text><text class="ts" x="510" y="452" text-anchor="middle" dominant-baseline="central">Outside the model</text></g>

<path d="M200 470 L200 490 L300 490 L300 510" class="arr" marker-end="url(#arrow)"/>
<path d="M510 470 L510 490 L380 490 L380 510" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="200" y="510" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="530" text-anchor="middle" dominant-baseline="central">Generate blind</text><text class="ts" x="340" y="548" text-anchor="middle" dominant-baseline="central">Tail sampling, modal excluded</text></g>
<line x1="340" y1="566" x2="340" y2="606" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="200" y="606" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="626" text-anchor="middle" dominant-baseline="central">Five premises</text><text class="ts" x="340" y="644" text-anchor="middle" dominant-baseline="central">Each with a probability</text></g>
<line x1="340" y1="662" x2="340" y2="702" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="200" y="702" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="722" text-anchor="middle" dominant-baseline="central">Execute the survivors</text><text class="ts" x="340" y="740" text-anchor="middle" dominant-baseline="central">400 words, in form</text></g>
<line x1="340" y1="758" x2="340" y2="798" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="200" y="798" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="818" text-anchor="middle" dominant-baseline="central">Judge the prose</text><text class="ts" x="340" y="836" text-anchor="middle" dominant-baseline="central">Three bins, tuned for recall</text></g>
<line x1="340" y1="854" x2="340" y2="894" class="arr" marker-end="url(#arrow)"/>

<g class="coral"><rect x="200" y="894" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="914" text-anchor="middle" dominant-baseline="central">Chris picks</text><text class="ts" x="340" y="932" text-anchor="middle" dominant-baseline="central">The only real decision</text></g>
<line x1="340" y1="950" x2="340" y2="990" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="200" y="990" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="1010" text-anchor="middle" dominant-baseline="central">log.jsonl</text><text class="ts" x="340" y="1028" text-anchor="middle" dominant-baseline="central">Labelled pairs accumulate</text></g>
</svg>
