<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fog Belt — the cull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eef1f2; --surface:#ffffff; --surface-2:#e7ecee;
  --ink:#121a1e; --ink-2:#33454d; --muted:#5a6971; --faint:#8fa1a9;
  --rule:#d0d9dc; --rule-2:#bcc8cd;
  --accent:#1b5e73; --accent-soft:#dceaee;
  --keep:#0e7a5c; --keep-soft:#dcefe8;
  --pass:#8b3a3a; --pass-soft:#f2e2e2;
  --maybe:#8a6a1f; --maybe-soft:#f4ecd8;
  --artifact:#5c4b8a; --artifact-soft:#e8e3f2;
  --ui:"Archivo","Segoe UI",system-ui,sans-serif;
  --prose:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1316; --surface:#151e22; --surface-2:#1c272c;
  --ink:#e4ebee; --ink-2:#bdcbd1; --muted:#8b9da6; --faint:#6b7d85;
  --rule:#243239; --rule-2:#33454d;
  --accent:#57b6ce; --accent-soft:#12333d;
  --keep:#3fbe94; --keep-soft:#0f2f26;
  --pass:#db8080; --pass-soft:#331b1b;
  --maybe:#dcb765; --maybe-soft:#332a14;
  --artifact:#a99ad6; --artifact-soft:#241f33;
}}
:root[data-theme="dark"]{
  --ground:#0d1316; --surface:#151e22; --surface-2:#1c272c;
  --ink:#e4ebee; --ink-2:#bdcbd1; --muted:#8b9da6; --faint:#6b7d85;
  --rule:#243239; --rule-2:#33454d;
  --accent:#57b6ce; --accent-soft:#12333d;
  --keep:#3fbe94; --keep-soft:#0f2f26;
  --pass:#db8080; --pass-soft:#331b1b;
  --maybe:#dcb765; --maybe-soft:#332a14;
  --artifact:#a99ad6; --artifact-soft:#241f33;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--ground); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden}

/* ---------- top bar ---------- */
header{display:flex; align-items:stretch; gap:0; background:var(--surface);
  border-bottom:1px solid var(--rule-2); flex:none}
.brand{display:flex; align-items:center; gap:9px; padding:0 16px;
  border-right:1px solid var(--rule); font-family:var(--mono); font-size:11px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
nav{display:flex}
.tab{appearance:none; background:none; border:0; border-right:1px solid var(--rule);
  padding:11px 18px 10px; cursor:pointer; color:var(--muted); font-family:var(--ui);
  font-size:14px; font-weight:600; display:grid; gap:1px; text-align:left;
  border-bottom:2px solid transparent}
.tab small{font-family:var(--mono); font-size:10.5px; font-weight:400;
  letter-spacing:.05em; color:var(--faint)}
.tab:hover{background:var(--surface-2); color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink); border-bottom-color:var(--accent);
  background:var(--surface-2)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-3px}
.tab.done{color:var(--faint)}
.tab.done small{color:var(--keep)}

.gauges{margin-left:auto; display:flex; align-items:center}
.g{padding:0 15px; border-left:1px solid var(--rule); display:grid; gap:0;
  align-content:center; min-height:52px}
.g b{font-family:var(--mono); font-size:15px; font-weight:600;
  font-variant-numeric:tabular-nums; line-height:1.2}
.g span{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint)}
.spark{display:flex; align-items:flex-end; gap:2px; height:18px}
.spark i{width:5px; background:var(--accent-soft); border-radius:1px 1px 0 0;
  display:block; min-height:2px}
.spark i.last{background:var(--accent)}
.flush{font-family:var(--mono); font-size:10px; color:var(--faint)}
.flush.busy{color:var(--maybe)}

/* ---------- main ---------- */
main{flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column}
.pane{flex:1; min-height:0; display:none; flex-direction:column}
.pane.on{display:flex}
.empty{margin:auto; text-align:center; max-width:44ch; padding:40px 20px;
  display:grid; gap:10px}
.empty b{font-size:19px} .empty p{margin:0; color:var(--muted); font-size:14px}

/* ---------- shared bits ---------- */
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:10px; padding:2px 6px; white-space:nowrap;
  border:1px solid var(--rule-2); border-radius:2px; color:var(--muted)}
.chip.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.chip.wh{border-color:var(--maybe); color:var(--maybe); background:var(--maybe-soft)}
.prose{font-family:var(--prose); font-size:19px; line-height:1.62; color:var(--ink)}
.prose p{margin:0 0 .72em}
.fade{color:var(--faint)}
.acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{font-family:var(--ui); font-size:13.5px; font-weight:600; padding:8px 14px;
  border-radius:3px; border:1px solid var(--rule-2); background:var(--surface);
  color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:7px}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.btn .k{font-family:var(--mono); font-size:10.5px; color:var(--faint); font-weight:500}
.btn.keep{color:var(--keep); border-color:var(--keep)} .btn.keep:hover{background:var(--keep-soft)}
.btn.pass{color:var(--pass); border-color:var(--pass)} .btn.pass:hover{background:var(--pass-soft)}
.btn.maybe{color:var(--maybe); border-color:var(--maybe)} .btn.maybe:hover{background:var(--maybe-soft)}
.btn.ghost{color:var(--muted)}
/* Not a verdict about the writing — a report that the text is broken. Its own
   colour so it never reads as a fourth opinion alongside keep/pass/maybe. */
.btn.artifact{color:var(--artifact); border-color:var(--artifact)}
.btn.artifact:hover{background:var(--artifact-soft)}
.rail i.artifact{background:var(--artifact)}
kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2);
  border:1px solid var(--rule-2); border-radius:3px; padding:1px 5px; color:var(--ink)}
.head{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.title{font-size:18px; font-weight:600; letter-spacing:-.01em}
.by{font-size:13px; color:var(--muted)}
.nums{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint);
  font-variant-numeric:tabular-nums}

/* ---------- deck ---------- */
/* A 40-word opening leaves most of the card empty. Centre it so the sparse
   state reads as deliberate rather than as a rendering accident, and so the
   eye lands in the same place on every card. */
#deck .card{flex:1; min-height:0; overflow-y:auto; padding:30px 34px;
  display:grid; gap:16px; align-content:center; justify-items:start;
  max-width:none}
#deck .card > *{width:100%}
#deck .prose{max-width:66ch}
#deck footer{flex:none; padding:12px 34px; border-top:1px solid var(--rule);
  background:var(--surface); display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.rail{flex:none; height:3px; display:flex; background:var(--surface-2)}
.rail i{display:block; height:100%}
.rail i.keep{background:var(--keep)} .rail i.pass{background:var(--pass)}
.rail i.maybe{background:var(--maybe)}

/* ---------- ledger ---------- */
#ledger .rows{flex:1; min-height:0; overflow-y:auto; background:var(--surface)}
.row{display:grid; grid-template-columns:36px 20px 1fr auto; gap:11px;
  align-items:baseline; padding:8px 14px; border-bottom:1px solid var(--rule);
  cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.cur{background:var(--accent-soft)}
.row.on{background:var(--keep-soft)}
.row.on.cur{box-shadow:inset 3px 0 0 var(--accent)}
.row-n{font-family:var(--mono); font-size:11px; color:var(--faint);
  font-variant-numeric:tabular-nums; text-align:right}
.box{width:14px; height:14px; border:1.5px solid var(--rule-2); border-radius:2px;
  display:grid; place-items:center; font-size:10px; color:var(--keep);
  font-weight:700; align-self:center}
.row.on .box{border-color:var(--keep); background:var(--keep-soft)}
.row-t{font-family:var(--prose); font-size:16.5px; line-height:1.44}
.row-l{font-family:var(--mono); font-size:10px; color:var(--faint); white-space:nowrap}
#ledger footer{flex:none; padding:12px 14px; border-top:1px solid var(--rule);
  background:var(--surface); display:flex; gap:14px; align-items:center; flex-wrap:wrap}

/* ---------- bench ---------- */
#bench .split{flex:1; min-height:0; display:grid; grid-template-columns:280px 1fr;
  gap:1px; background:var(--rule)}
.queue{background:var(--surface); overflow-y:auto}
.q{padding:10px 13px; border-bottom:1px solid var(--rule); cursor:pointer;
  display:grid; gap:4px}
.q:hover{background:var(--surface-2)}
.q.cur{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.q-t{font-size:13px; font-weight:600; line-height:1.25}
.q-m{font-family:var(--mono); font-size:10px; color:var(--faint); display:flex;
  gap:8px; font-variant-numeric:tabular-nums}
.stage{background:var(--surface); overflow-y:auto; padding:28px 34px 20px;
  display:grid; gap:18px; align-content:start}
.stage .prose{max-width:66ch}
.dims{display:grid; gap:5px; max-width:420px}
.dimrow{display:grid; grid-template-columns:80px 1fr 46px; gap:10px; align-items:center}
.dimrow span{font-family:var(--mono); font-size:10px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.05em}
.dimrow em{font-family:var(--mono); font-size:11px; font-style:normal;
  font-variant-numeric:tabular-nums; text-align:right}
#bench footer{flex:none; padding:12px 34px; border-top:1px solid var(--rule);
  background:var(--surface); display:flex; gap:12px; align-items:center; flex-wrap:wrap}
input.note{font-family:var(--ui); font-size:13.5px; padding:8px 11px; flex:1;
  min-width:180px; background:var(--ground); color:var(--ink);
  border:1px solid var(--rule-2); border-radius:3px}
input.note:focus{outline:2px solid var(--accent); outline-offset:-1px}

/* ---------- toast ---------- */
#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--ground); font-family:var(--mono);
  font-size:12px; padding:9px 14px; border-radius:4px; display:none;
  align-items:center; gap:12px; box-shadow:0 8px 30px -10px rgba(0,0,0,.5); z-index:9}
#toast.on{display:flex}
#toast button{appearance:none; background:none; border:1px solid currentColor;
  color:inherit; font-family:var(--mono); font-size:11px; padding:2px 7px;
  border-radius:3px; cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){
  #bench .split{grid-template-columns:1fr; grid-template-rows:180px 1fr}
  .gauges{display:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">Fog&nbsp;Belt · cull</div>
  <nav id="tabs">
    <button class="tab" data-mode="ledger" aria-current="false">Ledger<small id="c-ledger">themes —</small></button>
    <button class="tab" data-mode="deck" aria-current="false">Deck<small id="c-deck">passages —</small></button>
    <button class="tab" data-mode="bench" aria-current="false">Bench<small id="c-bench">survivors —</small></button>
  </nav>
  <div class="gauges">
    <div class="g"><b id="g-keep">—</b><span>keep rate</span></div>
    <div class="g"><div class="spark" id="g-spark"></div><span>per 50</span></div>
    <div class="g"><b id="g-short">—</b><span>cells short</span></div>
    <div class="g"><span class="flush" id="g-flush">idle</span></div>
  </div>
</header>

<main>
  <!-- ===== LEDGER ===== -->
  <section class="pane" id="ledger">
    <div class="empty" id="ledger-empty" hidden></div>
    <div class="rows" id="ledger-rows"></div>
    <footer>
      <button class="btn keep" id="ledger-commit">Commit screen <span class="k">enter</span></button>
      <span class="fade" style="font-family:var(--mono); font-size:11.5px">
        <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>x</kbd> keep · unmarked pass ·
        kept <b id="ledger-count" style="color:var(--keep)">0</b> of
        <b id="ledger-screen" style="color:var(--ink)">0</b></span>
    </footer>
  </section>

  <!-- ===== DECK ===== -->
  <section class="pane" id="deck">
    <div class="empty" id="deck-empty" hidden></div>
    <div class="rail" id="deck-rail"></div>
    <div class="card">
      <div class="head">
        <div class="title" id="deck-title">—</div>
        <div class="by" id="deck-by"></div>
        <div class="nums" id="deck-nums"></div>
      </div>
      <div class="chips" id="deck-chips"></div>
      <div class="prose" id="deck-text"></div>
    </div>
    <footer>
      <button class="btn keep" data-v="keep">Keep <span class="k">f</span></button>
      <button class="btn pass" data-v="pass">Pass <span class="k">j</span></button>
      <button class="btn maybe" data-v="maybe">Maybe <span class="k">m</span></button>
      <button class="btn ghost" id="deck-expand">Expand <span class="k">space</span></button>
      <button class="btn artifact" data-v="artifact">Artifact <span class="k">a</span></button>
      <span class="fade" style="font-family:var(--mono); font-size:11.5px"
        id="deck-pos"></span>
    </footer>
  </section>

  <!-- ===== BENCH ===== -->
  <section class="pane" id="bench">
    <div class="empty" id="bench-empty" hidden></div>
    <div class="split">
      <div class="queue" id="bench-queue"></div>
      <div class="stage">
        <div class="head">
          <div class="title" id="bench-title">—</div>
          <div class="by" id="bench-by"></div>
          <div class="nums" id="bench-nums"></div>
        </div>
        <div class="chips" id="bench-chips"></div>
        <div class="prose" id="bench-text"></div>
        <div class="dims" id="bench-dims"></div>
      </div>
    </div>
    <footer>
      <button class="btn keep" data-bv="keep">Keep <span class="k">f</span></button>
      <button class="btn pass" data-bv="pass">Pass <span class="k">j</span></button>
      <button class="btn maybe" data-bv="maybe">Maybe <span class="k">m</span></button>
      <input class="note" id="bench-note" placeholder="note (optional) — kept with the verdict">
      <span class="fade" style="font-family:var(--mono); font-size:11.5px" id="bench-pos"></span>
    </footer>
  </section>
</main>

<div id="toast"><span id="toast-text"></span><button id="toast-undo">undo · u</button></div>

<script>
"use strict";
const FACETS = ["voice","mode","reference","persuasion","abstraction","elaboration"];
const DIMS = ["d1","d2","d3","d4","d5","d6"];
const POLES = {voice:["informational","involved"], mode:["non-narrative","narrative"],
  reference:["situated","elaborated"], persuasion:["unpersuasive","persuasive"],
  abstraction:["non-abstract","abstract"], elaboration:["unelaborated","elaborated"]};
const SCREEN = 20;          // ledger rows per screen
const FLUSH_MS = 1400;      // undo window before a verdict is written
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opening = (t, n) => {
  const w = t.split(/\s+/);
  return [w.slice(0, n).join(" "), Math.max(0, w.length - n)];
};

/* =======================================================================
   Pending verdicts.
   A verdict is not posted the instant a key goes down: it sits here for
   FLUSH_MS with an undo affordance. Undo inside that window removes it and
   nothing is ever written. Undo outside it appends a superseding row — the
   trail is append-only, so a correction is a new row, never an erasure.
   ======================================================================= */
const pending = [];
let flushTimer = null, posting = false;

function queueVerdict(row, label){
  pending.push(row);
  showToast(label);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, FLUSH_MS);
  paintFlush();
}

function unqueueLast(){
  const row = pending.pop();
  paintFlush();
  return row;
}

async function flush(){
  if (posting || !pending.length) return;
  const batch = pending.splice(0, pending.length);
  posting = true; paintFlush();
  try {
    const res = await fetch("/api/verdict", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(batch)
    });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const data = await res.json();
    applyStats(data.stats);
  } catch (e) {
    // Put them back and say so. Losing a verdict silently is the one
    // unacceptable failure here.
    pending.unshift(...batch);
    showToast("not saved: " + e.message, true);
  } finally {
    posting = false; paintFlush();
    if (pending.length) flushTimer = setTimeout(flush, FLUSH_MS);
  }
}
window.addEventListener("beforeunload", e => {
  if (pending.length) { flush(); e.preventDefault(); e.returnValue = ""; }
});

function paintFlush(){
  const f = el("g-flush");
  f.textContent = posting ? "saving…" : pending.length ? pending.length + " pending" : "saved";
  f.classList.toggle("busy", posting || pending.length > 0);
}

let toastTimer = null;
function showToast(text, sticky){
  el("toast-text").textContent = text;
  el("toast").classList.add("on");
  el("toast-undo").style.display = sticky ? "none" : "";
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => el("toast").classList.remove("on"), FLUSH_MS);
}
el("toast-undo").addEventListener("click", () => MODE_API[mode].undo());

/* ---------- stats ---------- */
function applyStats(s){
  if (!s) return;
  const p = s.passages, t = s.themes;
  el("c-ledger").textContent = t.unlabelled ? `${t.unlabelled} themes left` : `${t.pool} done`;
  el("c-deck").textContent = p.unlabelled ? `${p.unlabelled} passages left` : `${p.pool} done`;
  el("c-bench").textContent = `${s.survivors} survivors`;
  el("tabs").querySelector('[data-mode="ledger"]').classList.toggle("done", !t.unlabelled);
  el("tabs").querySelector('[data-mode="deck"]').classList.toggle("done", !p.unlabelled);
  const judged = p.keep + p.pass + p.maybe;
  el("g-keep").textContent = judged ? Math.round(100 * p.keep / judged) + "%" : "—";
  const rates = p.keep_rate || [];
  el("g-spark").innerHTML = rates.length
    ? rates.slice(-14).map((r, i, a) =>
        `<i class="${i === a.length-1 ? "last" : ""}" style="height:${Math.max(2, r*18)}px"
           title="${Math.round(r*100)}%"></i>`).join("")
    : '<i style="height:2px"></i>';
  const short = Object.keys(s.cells_short || {}).length;
  el("g-short").textContent = short + "/9";
}

/* ---------- rendering helpers ---------- */
function chipRow(f, withheld){
  const out = FACETS.filter(k => f[k]).map(k => {
    const on = f[k] === POLES[k][0] || f[k] === POLES[k][1];
    return `<span class="chip${on ? " on" : ""}">${k.slice(0,4)} ${esc(f[k])}</span>`;
  });
  if (withheld) out.push('<span class="chip wh">withheld</span>');
  return out.join("");
}
function proseHTML(text){
  return text.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join("");
}
function dimBar(v){
  const LO = -3.5, HI = 4.5, W = 200;
  const zero = (0 - LO) / (HI - LO) * W, pos = (v - LO) / (HI - LO) * W;
  const left = Math.min(zero, pos), w = Math.max(Math.abs(pos - zero), 1);
  return `<svg viewBox="0 0 ${W} 12" preserveAspectRatio="none" width="100%" height="12"
    role="img" aria-label="z ${v.toFixed(2)}">
    <rect x="0" y="4.5" width="${W}" height="3" fill="var(--surface-2)"/>
    <rect x="${zero}" y="1" width="1" height="10" fill="var(--rule-2)"/>
    <rect x="${left}" y="3" width="${w}" height="6" rx="1"
      fill="${v >= 0 ? "var(--accent)" : "var(--muted)"}"/>
  </svg>`;
}
function keepInView(box, node){
  if (!box || !node) return;
  const top = node.offsetTop, bot = top + node.offsetHeight;
  if (top < box.scrollTop) box.scrollTop = top;
  else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight;
}
async function getQueue(m, order){
  const res = await fetch(`/api/queue?mode=${m}&limit=200${order ? "&order="+order : ""}`);
  return res.json();
}
/* An empty queue hides the working parts and shows a message beside them; it
   must never replace them. Overwriting the pane destroyed #bench-queue, and
   the next survivor to arrive from a triage pass then had nothing to render
   into. */
function setEmpty(pane, on, title, note){
  const box = el(pane + "-empty");
  box.hidden = !on;
  if (on) box.innerHTML = `<b>${esc(title)}</b><p>${note}</p>`;
  for (const child of el(pane).children)
    if (child !== box) child.hidden = on;
}

/* =======================================================================
   LEDGER — themes, 20 a screen, keep by number
   ======================================================================= */
const Ledger = (() => {
  let items = [], cur = 0, on = new Set(), total = 0, ready = false;
  function screenItems(){ return items.slice(0, SCREEN); }
  async function load(){
    const q = await getQueue("ledger");
    items = q.items; total = q.total; cur = 0; on = new Set(); ready = true; draw();
  }
  function draw(){
    const g = screenItems();
    if (!g.length) {
      setEmpty("ledger", true, "Themes done",
        "Every theme has a verdict. <kbd>2</kbd> for the Deck.");
      return;
    }
    setEmpty("ledger", false);
    cur = Math.max(0, Math.min(cur, g.length - 1));
    el("ledger-count").textContent = on.size;
    el("ledger-screen").textContent = g.length;
    el("ledger-rows").innerHTML = g.map((t, n) => `
      <div class="row${on.has(n) ? " on" : ""}${n === cur ? " cur" : ""}" data-n="${n}">
        <div class="row-n">${n+1}</div>
        <div class="box">${on.has(n) ? "✓" : ""}</div>
        <div class="row-t">${esc(t.text)}</div>
        <div class="row-l">${esc(t.label || t.source)}</div>
      </div>`).join("");
    el("ledger-rows").querySelectorAll(".row").forEach(r =>
      r.addEventListener("click", () => { cur = +r.dataset.n; toggle(); }));
    if (ready) keepInView(el("ledger-rows"), el("ledger-rows").querySelector(".row.cur"));
  }
  function toggle(){ on.has(cur) ? on.delete(cur) : on.add(cur); draw(); }
  function move(d){ cur = Math.max(0, Math.min(screenItems().length - 1, cur + d)); draw(); }
  function commit(){
    const g = screenItems();
    if (!g.length) return;
    g.forEach((t, n) => pending.push({
      id: t.id, bank: "themes", method: "ledger",
      verdict: on.has(n) ? "keep" : "pass",
    }));
    showToast(`${on.size} kept, ${g.length - on.size} passed`);
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, FLUSH_MS); paintFlush();
    items = items.slice(SCREEN); on = new Set(); cur = 0;
    if (items.length < SCREEN) load(); else draw();
  }
  function undo(){
    // A committed screen is one batch; undo drops the whole screen from the
    // pending buffer and puts it back on the board.
    if (!pending.length) return showToast("nothing pending", true);
    pending.length = 0; paintFlush();
    el("toast").classList.remove("on");
    load();
  }
  return {load, draw, undo, keys(k){
    if (k === "arrowdown" || k === "j") return move(1), true;
    if (k === "arrowup" || k === "k") return move(-1), true;
    if (k === "x" || k === " ") return toggle(), true;
    if (k === "enter") return commit(), true;
    return false;
  }};
})();

/* =======================================================================
   DECK — passages, 40 words, expandable, one at a time
   ======================================================================= */
const Deck = (() => {
  let items = [], i = 0, expanded = false, total = 0;
  const done = [];
  async function load(){
    const q = await getQueue("deck");
    items = q.items; total = q.total; i = 0; expanded = false; draw();
  }
  function draw(){
    i = Math.max(0, Math.min(i, items.length - 1));
    const p = items[i];
    if (!p) {
      setEmpty("deck", true, "Nothing unlabelled",
        "Every passage has a verdict. <kbd>3</kbd> for the Bench.");
      return;
    }
    setEmpty("deck", false);
    el("deck-title").textContent = p.title;
    el("deck-by").textContent = p.author ? "— " + p.author : p.source;
    el("deck-nums").textContent =
      `${p.words}w · score ${p.score.toFixed(3)} · ${p.cell} · ${p.id}`;
    el("deck-chips").innerHTML = chipRow(p.facets, p.withheld);
    if (expanded) {
      el("deck-text").innerHTML = proseHTML(p.text);
    } else {
      const [head, more] = opening(p.text, 40);
      el("deck-text").innerHTML = `<p>${esc(head)}` +
        (more ? ` <span class="fade">… ${more} more words</span>` : "") + "</p>";
    }
    el("deck-expand").style.visibility = expanded ? "hidden" : "";
    el("deck-pos").textContent = `${total - items.length + i + 1} of ${total}`;
    el("deck-rail").innerHTML = done.slice(-400).map(v =>
      `<i class="${v}" style="width:${100/Math.min(400, Math.max(done.length,1))}%"></i>`).join("");
  }
  function verdict(v){
    const p = items[i];
    if (!p) return;
    // "artifact" is not a fourth verdict. The passage is passed, because a
    // passage with markup in it is not usable prose; the method says the
    // reason is the stripper rather than the writing, so the flagged ids can
    // be pulled back out of the trail and fixed at source.
    const artifact = v === "artifact";
    queueVerdict({
      id: p.id,
      verdict: artifact ? "pass" : v,
      method: artifact ? "artifact" : (expanded ? "manual" : "triage"),
      note: artifact ? "markup or extraction artifact in the text" : "",
    }, `${artifact ? "flagged" : v} · ${p.title}`);
    done.push(artifact ? "artifact" : v);
    items.splice(i, 1); expanded = false;
    if (i >= items.length) i = Math.max(0, items.length - 1);
    if (items.length < 8) load(); else draw();
  }
  function undo(){
    const row = unqueueLast();
    el("toast").classList.remove("on");
    if (!row) return showToast("already saved — verdict stands", true);
    done.pop();
    load();
  }
  return {load, draw, undo, keys(k){
    if (k === "f") return verdict("keep"), true;
    if (k === "j") return verdict("pass"), true;
    if (k === "m") return verdict("maybe"), true;
    if (k === "a") return verdict("artifact"), true;
    if (k === " ") { expanded = true; draw(); return true; }
    if (k === "u") return undo(), true;
    return false;
  }};
})();

/* =======================================================================
   BENCH — survivors, full text, all six dimensions, notes
   ======================================================================= */
const Bench = (() => {
  let items = [], cur = 0, ready = false;
  async function load(){
    const q = await getQueue("bench", "cluster");
    items = q.items; ready = true; draw();
  }
  function draw(){
    if (!items.length) {
      setEmpty("bench", true, "Bench is empty",
        "Nothing has survived a triage pass yet. Run the Deck first — a keep " +
        "or maybe on the opening lands here for the full read. A verdict " +
        "given after expanding is already a full read and does not.");
      return;
    }
    setEmpty("bench", false);
    // Clamp here, not only in load(): draw() is also reached from click
    // handlers and keys, and an async reload can shrink `items` underneath a
    // cur that was valid when it was set.
    cur = Math.max(0, Math.min(cur, items.length - 1));
    const p = items[cur];
    el("bench-queue").innerHTML = items.map((q, n) => `
      <div class="q${n === cur ? " cur" : ""}" data-n="${n}">
        <div class="q-t">${esc(q.title)}</div>
        <div class="q-m"><span>${q.words}w</span><span>${q.score.toFixed(3)}</span>
          <span>${esc(q.cell.split("/").map(x => x.slice(0,6)).join("/"))}</span></div>
      </div>`).join("");
    el("bench-queue").querySelectorAll(".q").forEach(q =>
      q.addEventListener("click", () => { cur = +q.dataset.n; draw(); }));
    el("bench-title").textContent = p.title;
    el("bench-by").textContent = p.author ? "— " + p.author : p.source;
    el("bench-nums").textContent = `${p.words}w · ${p.source} · ${p.id}`;
    el("bench-chips").innerHTML = chipRow(p.facets, p.withheld);
    el("bench-text").innerHTML = proseHTML(p.text);
    el("bench-dims").innerHTML =
      `<div class="dimrow"><span></span><span style="font-size:9.5px; display:flex;
        justify-content:space-between; color:var(--faint)"><span>−3.5</span>
        <span>0</span><span>+4.5</span></span><span></span></div>` +
      DIMS.filter(d => d in p.dims).map((d, n) => `<div class="dimrow">
        <span>${FACETS[DIMS.indexOf(d)]}</span>${dimBar(p.dims[d])}
        <em>${p.dims[d] >= 0 ? "+" : ""}${p.dims[d].toFixed(2)}</em></div>`).join("");
    el("bench-pos").textContent = `${cur+1} of ${items.length}`;
    if (ready) keepInView(el("bench-queue"), el("bench-queue").querySelector(".q.cur"));
  }
  function verdict(v){
    const p = items[cur];
    if (!p) return;
    const note = el("bench-note").value.trim();
    queueVerdict({id: p.id, verdict: v, method: "bench", note}, `${v} · ${p.title}`);
    el("bench-note").value = "";
    items.splice(cur, 1);
    if (cur >= items.length) cur = Math.max(0, items.length - 1);
    draw();
  }
  function undo(){
    const row = unqueueLast();
    el("toast").classList.remove("on");
    if (!row) return showToast("already saved — verdict stands", true);
    load();
  }
  return {load, draw, undo, keys(k){
    if (k === "f") return verdict("keep"), true;
    if (k === "j") return verdict("pass"), true;
    if (k === "m") return verdict("maybe"), true;
    if (k === "arrowdown" || k === "n") { cur = Math.min(items.length-1, cur+1); draw(); return true; }
    if (k === "arrowup" || k === "p") { cur = Math.max(0, cur-1); draw(); return true; }
    if (k === "u") return undo(), true;
    return false;
  }};
})();

/* =======================================================================
   shell
   ======================================================================= */
const MODE_API = {ledger: Ledger, deck: Deck, bench: Bench};
const ORDER = ["ledger", "deck", "bench"];
let mode = "ledger";

function setMode(m){
  mode = m;
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === m));
  el("tabs").querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-current", String(t.dataset.mode === m)));
  location.hash = m;
  MODE_API[m].load();
}
el("tabs").querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => setMode(t.dataset.mode)));

document.querySelectorAll("#deck [data-v]").forEach(b =>
  b.addEventListener("click", () => Deck.keys(
    {keep: "f", pass: "j", maybe: "m", artifact: "a"}[b.dataset.v])));
document.querySelectorAll("#bench [data-bv]").forEach(b =>
  b.addEventListener("click", () => Bench.keys(b.dataset.bv === "keep" ? "f"
    : b.dataset.bv === "pass" ? "j" : "m")));
el("deck-expand").addEventListener("click", () => Deck.keys(" "));
el("ledger-commit").addEventListener("click", () => Ledger.keys("enter"));

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  // The note field owns its own keys; escape hands them back.
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) {
    if (e.key === "Escape") t.blur();
    return;
  }
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "3") { setMode(ORDER[+k - 1]); e.preventDefault(); return; }
  if (k === "?") { showToast("1/2/3 mode · f keep · j pass · m maybe · a artifact · u undo", true); return; }
  if (MODE_API[mode].keys(k)) e.preventDefault();
});

(async function start(){
  applyStats(await (await fetch("/api/stats")).json());
  const want = location.hash.replace("#", "");
  setMode(ORDER.includes(want) ? want : "ledger");
})();
</script>
