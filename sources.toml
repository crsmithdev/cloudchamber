# What to read, and what to take from it.
#
# passages = feed the exemplar bank (verbatim prose, conditions HOW it reads)
# themes   = feed the theme bank    (abstractions,   conditions WHAT gets made)
#
# reader: pdf | scp | markdown | research
#   research means no code reads anything — `pipeline themes --research <id>`
#   emits a brief, a Claude session does the reading, and the result comes
#   back via `pipeline themes --ingest`.

[source.scp]
path = "sources/texts/scp/*.md"
reader = "scp"
passages = true
themes = true
kind = "document"
license = "CC BY-SA 3.0"
notes = "Verbatim wikidot source. Attribution required on anything published."

[source.datlow]
path = "sources/texts/books/Ellen Datlow*.pdf"
reader = "pdf"
passages = true
themes = true
kind = "fiction"
notes = "Anthologies. Story splitting is best-effort; check attribution before quoting."

[source.evenson]
path = "sources/texts/books/Brian Evenson*.pdf"
reader = "pdf"
author = "Brian Evenson"
kind = "fiction"

[source.langan]
path = "sources/texts/books/John Langan*.pdf"
reader = "pdf"
author = "John Langan"
kind = "fiction"

[source.watts]
path = "sources/texts/books/Peter Watts*.pdf"
reader = "pdf"
