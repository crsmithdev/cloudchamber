# The tools voice-bridge-mcp exposes for this project. Each runs the cloudchamber
# command shown, in this directory, and returns what it printed.

description = """
Cloud Chamber is a story-ideation pipeline. A draw takes a seed and six example passages, produces five premises, executes each as a 400-word vignette, and waits at the gate. A draw it is not worth choosing from just stays at the gate; archive hides it, redraw starts another like it, delete removes it. Chris chooses one at the gate; the draw then derives an outline, two context vignettes and an ending, and exports a brief. A finished brief is checked (gate 1: accept or dismiss findings by id, hold, pass) and then drafted into scenes (gate 2: keep, rewrite one scene, pass).

Rules. Never choose, accept, dismiss, keep, pass, archive or delete at any gate unless Chris says to, and never guess a step or finding id: read it from the tool output. You do not write premises, vignettes or stories yourself; the pipeline does. draw, check and draft take minutes and return a job id; when Chris asks whether it is done, read the job. When a draw is awaiting the gate, use candidates to read the five in full; when reading candidates aloud, read the premise, then the vignette, in the order printed, without summarising. Draw ids look like 20260906203231-7923; Chris may refer to a draw by its seed words, so match those against the draws list.
"""

[tools.status]
description = "The pool, the bank, eligibility per source, and how many draws are in each status."
command = ["./cloudchamber", "status"]

[tools.draws]
description = "Every draw, newest first: id, name, status, mode, setting, and the seed. The name is three words of the seed, so it is what Chris says when he names a draw. Statuses: awaiting_gate (choose a candidate), running, done (brief exported), awaiting_check_gate (gate 1), awaiting_draft_gate (gate 2), rejected, flagged. Archived draws are left out."
command = ["./cloudchamber", "draws"]

[tools.draw]
description = "Start a draw. Produces five premises and vignettes, then stops at the gate. With no arguments the draw is unrestricted. Do not pass auto unless Chris says so; it skips the gate by taking the lowest stated probability."
command = ["./cloudchamber", "draw"]
background = true
[tools.draw.args.genre]
description = "free text for the premises ask: horror, scifi, cosmic horror, weird fiction, body horror, hard scifi, or a blend like 'cosmic horror and hard scifi'. Left out, it follows the examples drawn."
flag = "--genre"
[tools.draw.args.sampling]
description = "where in the stated distribution the five premises are asked for: tail is the strangest and the default, standard the most conventional"
enum = ["tail", "off-centre", "standard"]
flag = "--sampling"
[tools.draw.args.setting]
description = "a typed setting id: setting-a, setting-b, setting-c"
flag = "--setting"
[tools.draw.args.domains]
description = "comma-separated domain slugs of the setting to pin"
flag = "--domains"
[tools.draw.args.source]
description = "bias the example passages to one or more sources, comma-separated: scp, datlow-01, evenson-contagion"
flag = "--source"
[tools.draw.args.author]
description = "bias the example passages to one author"
flag = "--author"
[tools.draw.args.seed]
description = "a seed sentence Chris dictates, instead of drawing one from the theme bank"
flag = "--seed"
[tools.draw.args.auto]
description = "skip the gate mechanically"
type = "boolean"
flag = "--auto"

[tools.knobs]
description = "Every tunable and its live values: the settings and their domain slugs, the genre shortcuts, the sampling modes, the example sources, the drafting defaults and the model per stage. Read this before guessing an argument to draw."
command = ["./cloudchamber", "help", "--md"]

[tools.candidates]
description = "The five candidates of a draw awaiting the gate, in full: premise and vignette each, sorted by stated probability, with the step id needed to choose one."
command = ["./cloudchamber", "candidates"]
[tools.candidates.args.draw]
description = "the draw id"
position = 1
required = true

[tools.draw_show]
description = "The steps and artifacts of one draw: which stages ran, which failed and why."
command = ["./cloudchamber", "draw-show"]
[tools.draw_show.args.draw]
position = 1
required = true

[tools.choose]
description = "Choose a candidate at the gate. The draw then derives the outline, context vignettes and ending in the background; the brief is ready when draws shows it done."
command = ["./cloudchamber", "gate"]
background = true
[tools.choose.args.draw]
position = 1
required = true
[tools.choose.args.verb]
position = 2
fixed = "choose"
[tools.choose.args.step]
description = "the execute step id of the candidate, from candidates"
position = 3
required = true

[tools.redraw]
description = "Start another draw on an existing draw's options: same seed, setting, domains, genre, sampling and sources. The draw it copies is left open and untouched. Any argument of draw may be given as well, and overrides the copy."
command = ["./cloudchamber", "draw"]
background = true
[tools.redraw.args.like]
description = "the draw to take the options from"
flag = "--like"
required = true
[tools.redraw.args.sampling]
description = "override where in the distribution the premises are asked for"
enum = ["tail", "off-centre", "standard"]
flag = "--sampling"
[tools.redraw.args.seed]
description = "override the seed with one Chris dictates"
flag = "--seed"

[tools.delete]
description = "Remove a draw and every step under it. Only for a draw that never developed a candidate; one that produced a brief is archived instead. There is no undo, so never call this unless Chris says to."
command = ["./cloudchamber", "delete"]
[tools.delete.args.draw]
position = 1
required = true

[tools.brief]
description = "Print a finished brief: trail, chosen vignette, outline, two context vignettes and the ending."
command = ["./cloudchamber", "brief"]
[tools.brief.args.draw]
position = 1
required = true

[tools.check]
description = "Run the checkers over a finished brief. Reports findings that recur and waits at gate 1."
command = ["./cloudchamber", "check"]
background = true
[tools.check.args.draw]
position = 1
required = true

[tools.findings]
description = "The findings of the latest check on a draw, each with its id, span, statement, evidence and replacement."
command = ["./cloudchamber", "findings"]
[tools.findings.args.draw]
position = 1
required = true

[tools.gate]
description = "Work a gate on Chris's instruction. Gate 1: accept <finding ids> (repairs into a new draw and re-checks, in the background), dismiss <finding id>, hold, pass, flag. Gate 2: keep (exports the draft), rewrite <scene number>, pass."
command = ["./cloudchamber", "gate"]
background = true
[tools.gate.args.draw]
position = 1
required = true
[tools.gate.args.action]
position = 2
required = true
enum = ["accept", "dismiss", "hold", "pass", "flag", "keep", "rewrite"]
[tools.gate.args.targets]
description = "finding ids for accept or dismiss; the scene number for rewrite"
position = 3
variadic = true
[tools.gate.args.note]
flag = "--note"
[tools.gate.args.finding]
description = "for rewrite: the flag id whose replacement guides the rewrite"
flag = "--finding"

[tools.draft]
description = "Draft a story from a checked brief: schedule, one scene per beat, screens, then gate 2. auto works gate 1 mechanically first."
command = ["./cloudchamber", "draft"]
background = true
[tools.draft.args.draw]
position = 1
required = true
[tools.draft.args.auto]
type = "boolean"
flag = "--auto"
[tools.draft.args.profile]
description = "a named drafting profile"
flag = "--profile"
[tools.draft.args.words]
description = "target length in words"
flag = "--words"
[tools.draft.args.beats]
description = "number of beats"
flag = "--beats"

[tools.story]
description = "The drafted story with its screen flags inline."
command = ["./cloudchamber", "story"]
[tools.story.args.draw]
position = 1
required = true
