# Drafting defaults (docs/specs/2026-09-05-drafting-pipeline.md). Any key can
# be overridden per draw; a profile bundles overrides; the resolved values are
# stored on the draw and written to drafts/<draw>/config.toml.

[length]
words = 5000
tolerance = 0.2         # the schedule's caps may sum to within this of words

[beats]
count = "auto"          # or an integer
min = 5
max = 10
words_min = 400
words_max = 800

[form]
tense = "auto"          # past | present
person = "auto"         # first | second | third
chronology = "auto"     # linear | nonlinear
container = "auto"      # prose | document | interleaved | told | rules: rules hangs the story on a numbered list of rules the narrator was given
ending = "brief"        # brief | open

[structure]
register = "auto"       # auto | none | told | signal | teller: the block every scene ask carries; auto follows the container (told) or the template (signal);
                        # teller is signal's plain speech and spoken numbers from a narrator who faces the listener and speaks to "you"
template = "auto"       # auto | listen | told | signal: listen states what a listener needs and derives the form from the brief; told is the narrated shape, a cold open, set pieces, an arrival, a cost, an aftermath; signal is the mission shape, one specialist close, an ensemble, a contact, a split, a cost, a return

[opening]
# how beat 1 opens, and what the hook screen asks of it (todo #9: the screen's 150-word window let 80-100 words of
# time, place and routine pass on 3cee and 1b09)
mode = "scene"          # scene: the hook within the window, the register's time-and-place first sentence; promise: the first one or two
                        # sentences say who the narrator is and what went wrong, as the title does; cold: open inside the anomaly;
                        # slow: no hook screen, for a slow-burn written story
window = 150            # words: the hook-late screen question, the line its rewrite carries, and the listen schedule's first beat
echo_title = false      # beat 1 keeps the seed title's promise in its own words (ba9d: a moon-signal title opened in a cellar)

[clarity]
signposts = "scene"     # scene: a beat that moves says the time and place in its first sentence; spoken: it opens on a mark a teller
                        # would say aloud ("Two nights later"), and beat 1's first sentence is the narrator's, not a time and a place
focal = "auto"          # auto | 1: one point of view, the narrator's
recap = false           # each beat after the first says once, early, what is at stake now

[scenes]
order = "sequential"    # sequential | parallel | acts: acts writes three runs of consecutive beats at once

[checks]
# the checks that read the brief as text, run by `draft` beside the schedule and shown at the plan gate. Gate 1's
# ledger, derivation and claims checkers went with T3 (spec 2026-09-28-story-ir §15): the bind holds each scene to
# the ledger, and the plan check reads the plan's claims against the setting
enabled = ["structure", "resemblance", "reader"]
samples = 2              # the score's recurrence term already separates 2 of 2 from 1 of 2
keep_if = 2
[checks.structure]
samples = 1
[checks.resemblance]
samples = 1

[screens]
enabled = ["plan", "ledger", "structure", "slop", "listen", "claims"]   # claims runs only under a setting that declares an authority;
                         # plan reads the schedule against the ledger beside the scenes, about $0.46 a draft (spec 2026-09-28-story-ir §14.5)
samples = 1              # four calls a scene was most of gate 2; the flags are read, not counted
keep_if = 1
slop_baseline = "pool"
[screens.structure]
samples = 1
[screens.listen]
long_share_max = 0.12    # share of a beat's sentences over 30 words; the narration pool sits at 0.04; over this, one rewrite
numerals_max = 24        # figures per 1k words in a beat, in digits or in words (one excepted); the pool sits at 5.1 and channel F
                         # at 5-7, while the three channel F drafts of 30 Sep-1 Oct ran 20-26 a draft and 38-47 at the peak beat,
                         # nearly all of it spelled out and unseen while only digits counted (then: pool 3.2, ceiling 12); over this, one rewrite
fix = "edit"             # edit | rewrite: 80 of 165 rewrites (19-26 Sep) were for length or numerals alone, and a rewrite
                         # changes 45-80% of a scene; edit rewrites only the sentences at fault, in one call, in place

[repair]
rounds = 4              # auto repair rounds at most, and the loop's only hard bound
stop_score = 7          # auto accepts reported findings scoring this or more, and stops when none do
patience = 2            # stop when the total open score has not fallen for this many rounds

# what a listener needs, as requirements and not as a plot: a first beat they cannot stop inside, an arrival
# in the flesh, a cost paid by a named person before the last beat, an aftermath; the form is the brief's,
# but the chronology is linear: heard once, a cold open and a flashback lost clarity in both orders. Person and
# tense stay the brief's: fixed to first and past (the channels' form) on 2 Oct, two drafts came out as a
# narrator's log, interior and doubling back, and GPT-5.1 gave the channel momentum and the hook
# (evals/20261002-figures-and-first-person.md)
[profiles.listen]
length.words = 10000
beats.min = 10
beats.max = 14
beats.words_max = 1100
form.chronology = "linear"
form.ending = "open"
structure.template = "listen"
structure.register = "signal"   # quoted plain speech, the feeling named, the hour, only the numbers a person would say aloud

# channel F's form: one narrator, first person, past, who faces the listener and tells it to be believed. The first
# sentences say what the title says, the narrator's work and the wrong thing; the time moves on spoken marks; there
# is one point of view. F's two stories run 6,700 and 7,400 words. The teller register and the promise opening face
# the narrator outward: first person alone made a narrator's log on 2 Oct (evals/20261002-figures-and-first-person.md)
[profiles.testimony]
length.words = 7000
beats.min = 8
beats.max = 11
beats.words_max = 1000
form.person = "first"
form.tense = "past"
form.chronology = "linear"
form.ending = "open"
structure.template = "listen"
structure.register = "teller"
opening.mode = "promise"
opening.window = 40
opening.echo_title = true
clarity.signposts = "spoken"
clarity.focal = 1

# channel L's rules stories: testimony, hung on a numbered list of rules the narrator was given, each rule opening a
# beat or a run of beats. L's three rules stories run 5,300 to 6,800 words, five or six rules each
[profiles.rules]
length.words = 6000
beats.min = 7
beats.max = 10
beats.words_max = 900
form.person = "first"
form.tense = "past"
form.chronology = "linear"
form.container = "rules"
form.ending = "open"
structure.template = "listen"
structure.register = "teller"
opening.mode = "promise"
opening.window = 40
opening.echo_title = true
clarity.signposts = "spoken"
clarity.focal = 1

# channel S's accounts: a narrator who speaks to the listener as "you", says at the outset what this account is and
# what it cost, and stops to say what is at stake and what will matter later. Five of S's seven stories are first
# person; the person stays the brief's. S runs 9,200 to 19,000 words, most near 11,000; its openings reach the wrong
# thing within about 40 to 130 words, so the window stays at 150, and its time moves on spoken marks
[profiles.dossier]
length.words = 11000
beats.min = 10
beats.max = 14
beats.words_max = 1200
form.chronology = "linear"
form.ending = "open"
structure.template = "listen"
structure.register = "teller"
opening.mode = "promise"
clarity.signposts = "spoken"
clarity.recap = true
