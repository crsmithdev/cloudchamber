# Drafting defaults (docs/specs/2026-09-05-drafting-pipeline.md). Any key can
# be overridden per draw; a profile bundles overrides; the resolved values are
# stored on the draw and written to drafts/<draw>/config.toml.

[length]
words = 5000
tolerance = 0.2         # the schedule's caps may sum to within this of words

[beats]
count = "auto"          # or an integer
min = 5
max = 10
words_min = 400
words_max = 800

[form]
tense = "auto"          # past | present
person = "auto"         # first | second | third
chronology = "auto"     # linear | nonlinear
container = "auto"      # prose | document | interleaved
ending = "brief"        # brief | open

[structure]
register = "auto"       # auto | none | told | signal: the block every scene ask carries; auto follows the container (told) or the template (signal)
template = "auto"       # auto | listen | told | signal: listen states what a listener needs and derives the form from the brief; told is the narrated shape, a cold open, set pieces, an arrival, a cost, an aftermath; signal is the mission shape, one specialist close, an ensemble, a contact, a split, a cost, a return

[scenes]
order = "sequential"    # sequential | parallel | acts: acts writes three runs of consecutive beats at once

[checks]
# the checks that read the brief as text, run by `draft` beside the schedule and shown at the plan gate. Gate 1's
# ledger, derivation and claims checkers went with T3 (spec 2026-09-28-story-ir §15): the bind holds each scene to
# the ledger, and the plan check reads the plan's claims against the setting
enabled = ["structure", "resemblance", "reader"]
samples = 2              # the score's recurrence term already separates 2 of 2 from 1 of 2
keep_if = 2
[checks.structure]
samples = 1
[checks.resemblance]
samples = 1

[screens]
enabled = ["plan", "ledger", "structure", "slop", "listen", "claims"]   # claims runs only under a setting that declares an authority;
                         # plan reads the schedule against the ledger beside the scenes, about $0.46 a draft (spec 2026-09-28-story-ir §14.5)
samples = 1              # four calls a scene was most of gate 2; the flags are read, not counted
keep_if = 1
slop_baseline = "pool"
[screens.structure]
samples = 1
[screens.listen]
long_share_max = 0.12    # share of a beat's sentences over 30 words; the narration pool sits at 0.04; over this, one rewrite
numerals_max = 24        # figures per 1k words in a beat, in digits or in words (one excepted); the pool sits at 5.1 and channel F
                         # at 5-7, while the three channel F drafts of 30 Sep-1 Oct ran 20-26 a draft and 38-47 at the peak beat,
                         # nearly all of it spelled out and unseen while only digits counted (then: pool 3.2, ceiling 12); over this, one rewrite
fix = "edit"             # edit | rewrite: 80 of 165 rewrites (19-26 Sep) were for length or numerals alone, and a rewrite
                         # changes 45-80% of a scene; edit rewrites only the sentences at fault, in one call, in place

[repair]
rounds = 4              # auto repair rounds at most, and the loop's only hard bound
stop_score = 7          # auto accepts reported findings scoring this or more, and stops when none do
patience = 2            # stop when the total open score has not fallen for this many rounds

[profiles.flash]
length.words = 1500
beats.count = 3

[profiles.novelette]
length.words = 12000
beats.min = 10
beats.max = 18

# told afterward to a listener, the way the narrated channels tell theirs: first person past, a cold open,
# an arrival and a cost, an aftermath; the register asks for the body before the meaning
[profiles.narrated]
length.words = 7000
beats.min = 8
beats.max = 10
beats.words_max = 1000
form.person = "first"
form.tense = "past"
form.container = "told"
form.ending = "open"
structure.template = "told"

# the mission shape of the long narrated channels: third person past, close on the one person who read the
# anomaly first, an ensemble named by role, a contact in the flesh, a split decision, a paid cost, a return;
# people speak in quoted lines and the feeling is named as it is felt
[profiles.signal]
length.words = 10000
beats.min = 10
beats.max = 14
beats.words_max = 1100
form.person = "third"
form.tense = "past"
form.chronology = "linear"
form.container = "prose"
form.ending = "open"
structure.template = "signal"

# what a listener needs, as requirements and not as a plot: a first beat they cannot stop inside, an arrival
# in the flesh, a cost paid by a named person before the last beat, an aftermath; the container is the brief's,
# but the chronology is linear (heard once, a cold open and a flashback lost clarity in both orders) and the
# story is one person's, told afterward: left to the brief, three drafts in a row took close third with two or
# three focal figures, two in the present tense, and GPT-5.1 named the shifts of view on 7 of its 8 clarity
# losses against channel F, whose stories are all one narrator, past tense
[profiles.listen]
length.words = 10000
beats.min = 10
beats.max = 14
beats.words_max = 1100
form.person = "first"
form.tense = "past"
form.chronology = "linear"
form.ending = "open"
structure.template = "listen"
structure.register = "signal"   # quoted plain speech, the feeling named, the hour, only the numbers a person would say aloud
