# Drafting defaults (docs/specs/2026-09-05-drafting-pipeline.md). Any key can
# be overridden per draw; a profile bundles overrides; the resolved values are
# stored on the draw and written to drafts/<draw>/config.toml.

[length]
words = 5000
tolerance = 0.2         # the schedule's caps may sum to within this of words

[beats]
count = "auto"          # or an integer
min = 5
max = 10
words_min = 400
words_max = 800

[form]
tense = "auto"          # past | present
person = "auto"         # first | second | third
chronology = "auto"     # linear | nonlinear
container = "auto"      # prose | document | interleaved
ending = "brief"        # brief | open

[structure]
template = "auto"       # only auto is built; the key is parsed

[scenes]
order = "sequential"    # sequential | parallel

[checks]
enabled = ["claims", "derivation", "ledger", "structure", "resemblance"]
samples = 3
keep_if = 2
[checks.structure]
samples = 1
[checks.resemblance]
samples = 1

[screens]
enabled = ["ledger", "structure", "slop"]
samples = 3
keep_if = 2
slop_baseline = "pool"
[screens.structure]
samples = 1

[repair]
rounds = 4              # auto repair rounds at most
stop_score = 7          # auto accepts findings scoring this or more, and stops when none do
patience = 2            # stop when the total open score has not fallen for this many rounds

[profiles.flash]
length.words = 1500
beats.count = 3

[profiles.novelette]
length.words = 12000
beats.min = 10
beats.max = 18
