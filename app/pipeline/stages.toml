# Model per stage. Every stage names a model explicitly: `--setting-sources ""`
# drops the CLI's configured default, so nothing is inherited. `fallback` is
# used once when the first model refuses. `system` is the one-line system
# prompt for the headless call; it is stored on every step row.

[themes]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You draft one-sentence themes from a story. Output only the tags asked for."

[redundancy]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You compare short sentences for restated meaning. Output only what is asked."

# The map is one call per reference file and 95% of distill's calls; it runs
# on its own stage so its model can move apart from the reduce and the trim.
[distill-map]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You classify reference material into typed sections. Output only the tags asked for."

[distill]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You classify reference material into typed sections. Output only the tags asked for."

[premises]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You generate story premises. Output only the tags asked for."

[execute]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

[outline]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You derive story structure from prose. Output only the tags asked for."

[context]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

[ending]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

# --- checking and drafting (docs/specs/2026-09-05-drafting-pipeline.md) -------
# `tools` is passed as both --tools and --allowedTools; stages without it run
# sealed. Only the claims verifier reaches the web, and only when the setting
# declares `claims: world`; under `reference` the same stage runs with no tools.

# The stages that read the brief share one system line: the brief goes ahead of it as the
# system prompt, and a call reads that prompt from the cache only when it matches word for word.
[check-derivation]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

[ledger-extract]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

[check-ledger]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

# One call a pass over the reported findings, the pairing step: a finding is kept only when its span asserts the fact and the evidence conflicts with it.
[check-verify]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

[check-structure]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

[check-resemblance]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

[check-claims-extract]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You read a story brief and answer what is asked about it. Output only the tags asked for."

[check-claims-verify]
model = "claude-sonnet-5"
fallback = "claude-opus-5"
system = "You verify one claim against a source. Output only the tag asked for."
tools = "WebSearch,WebFetch"

# One call a round, only when auto accepts two or more fixes at once.
[reconcile]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You compare short sentences for whether they can all hold at once. Output only the tags asked for."

[repair-vignette]
model = "claude-opus-5"
