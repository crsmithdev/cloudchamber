[schedule]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You derive a story's schedule from its plan. Output only the tags asked for."

[scene]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

[screen-ledger]
