# Model per stage. Every stage names a model explicitly: `--setting-sources ""`
# drops the CLI's configured default, so nothing is inherited. `fallback` is
# used once when the first model refuses. `system` is the one-line system
# prompt for the headless call; it is stored on every step row.

[themes]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You draft one-sentence themes from a story. Output only the tags asked for."

[redundancy]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You compare short sentences for restated meaning. Output only what is asked."

# The map is extraction, one call per reference file, and 95% of distill's
# calls; the reduce and the trim are the judgement and stay on opus.
[distill-map]
model = "claude-sonnet-5"
fallback = "claude-opus-5"
system = "You classify reference material into typed sections. Output only the tags asked for."

[distill]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You classify reference material into typed sections. Output only the tags asked for."

[premises]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You generate story premises. Output only the tags asked for."

[execute]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

[outline]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You derive story structure from prose. Output only the tags asked for."

[jobs]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You plan vignettes from a story's structure. Output only the tags asked for."

[context]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

[ending]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You write prose fiction. Output only the tag asked for."

# --- checking and drafting (docs/specs/2026-09-05-drafting-pipeline.md) -------
# `tools` is passed as both --tools and --allowedTools; stages without it run
# sealed. Only the claims verifier reaches the web, and only when the setting
# declares `claims: world`; under `reference` the same stage runs with no tools.

[check-derivation]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You check a story plan's derivation against its own text. Output only the tags asked for."

[ledger-extract]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You extract a ledger of settled facts from a story plan. Output only the tag asked for."

[check-ledger]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You check prose against a ledger of settled facts. Output only the tags asked for."

[check-structure]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You answer binary questions about a story plan with quotes. Output only the tags asked for."

[check-resemblance]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You match a story plan against a list. Output only the tags asked for."

[check-claims-extract]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
system = "You extract checkable claims from fiction. Output only the tags asked for."

[check-claims-verify]
model = "claude-sonnet-5"
fallback = "claude-opus-5"
system = "You verify one claim against a source. Output only the tag asked for."
tools = "WebSearch,WebFetch"

[repair-vignette]
model = "claude-opus-5"
fallback = "claude-sonnet-5"
